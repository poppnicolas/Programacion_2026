<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelicudle - Nivel 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="body-juego" data-nivel="3">
    <section class="juego">
        <div id="portada"></div>
        <div class="derecha">
            <h2>Nivel 3 - Película <span id="numero-pelicula">1</span>/5</h2>
            <div id="intentos" aria-label="Intentos restantes" class="intentos"></div>
            <div id="busqueda" class="busqueda">
                <div class="busqueda-inputs">
                    <input id="entrada-busqueda" type="text" placeholder="Nombre de la película">
                    <div id="sugerencias" class="sugerencias"></div>
                </div>
                <button id="boton-adivinar">Adivinar</button>
                <button id="boton-omitir" type="button">Omitir</button>
            </div>
            <table class="tabla-intentos">
                <tr class="encabezados">
                    <th class="columnaPeli">Pelicula</th>
                    <th>Año de estreno</th>
                    <th>Género</th>
                    <th>Rating</th>
                    <th>Director</th>
                    <th>País de origen</th>
                </tr>
            </table>
        </div>
    </section>

    <script src="../script.js"></script>
</body>

</html>
