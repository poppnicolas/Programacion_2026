<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Pelicudle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">

</head>

<body class="body-resultados">
    <div class="contenedor-resultados">
        <h1>¡FIN DEL JUEGO!</h1>
        <div class="puntuacion" id="puntuacion">0/5</div>
        <div class="mensaje" id="mensaje"></div>
        <div class="contenedor-gif"></div>
        <div class="botones-resultados">
            <div class="btn-group">
                <button id="btn-jugar-siguiente">SEGUIR JUGANDO</button>
                <button id="btn-desplegar-niveles">▼</button>
            </div>
            <button onclick="location.href='./index.html'">INICIO</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const aciertos = parseInt(params.get('aciertos')) || 0;
        const nivelActual = parseInt(params.get('nivel')) || 1;
        const siguienteNivel = nivelActual < 5 ? nivelActual + 1 : 1;

        document.getElementById('puntuacion').textContent = `${aciertos}/5`;

        let mensaje = '';
        let imagen = '';

        if (aciertos === 5) {
            mensaje = '¡PERFECTO! ¡Sos un cinéfilo de verdad! 🎬✨';
            imagen = '../img/gifResultadoBien.gif';
        } else if (aciertos >= 3) {
            mensaje = 'Adivinaste 3 películas. ¡Buen conocimiento! 🎥';
            imagen = '../img/gifResultadoMaso.gif';
        } else if (aciertos >= 1) {
            mensaje = `Solo adivinaste ${aciertos}. ¡Seguí intentando! 🍿`;
            imagen = '../img/gifResultadoMal.gif';
        } else {
            mensaje = 'No acertaste ninguna. ¡Volvé a intentar! 🎞️';
            imagen = '../img/gifResultadoNing.gif';
        }

        document.getElementById('mensaje').textContent = mensaje;
        const imagenElemento = document.querySelector('.contenedor-gif');
        imagenElemento.innerHTML = `<img src="${imagen}" alt="Resultado">`;
        imagenElemento.style.display = 'block';
        imagenElemento.querySelector('img').onerror = function() {
            this.style.display = 'none';
            this.alt = 'Imagen no disponible';
        };

        // Configurar el botón de SEGUIR JUGANDO para ir al siguiente nivel
        document.getElementById('btn-jugar-siguiente').onclick = function() {
            location.href = `./nivel${siguienteNivel}.html`;
        };
    </script>
</body>

</html>
