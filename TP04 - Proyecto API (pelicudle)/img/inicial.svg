<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado naranja -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad3)"/>
  
  <!-- Carita pensativa/triste -->
  <circle cx="200" cy="180" r="100" fill="#FFE4B5" stroke="#FF8C00" stroke-width="3"/>
  
  <!-- Ojos -->
  <circle cx="170" cy="150" r="12" fill="#2C3E50"/>
  <circle cx="230" cy="150" r="12" fill="#2C3E50"/>
  <circle cx="173" cy="147" r="4" fill="#fff"/>
  <circle cx="233" cy="147" r="4" fill="#fff"/>
  
  <!-- Boca pensativa -->
  <path d="M 180 190 Q 200 200 220 190" stroke="#FF8C00" stroke-width="3" fill="none"/>
  
  <!-- Signo de pregunta flotante -->
  <text x="280" y="120" font-size="60" fill="#FFD700" font-weight="bold">?</text>
  
  <!-- Palomitas de maíz -->
  <circle cx="100" cy="100" r="8" fill="#FFB6C1"/>
  <circle cx="115" cy="95" r="7" fill="#FFB6C1"/>
  <circle cx="108" cy="110" r="7" fill="#FFB6C1"/>
  <circle cx="300" cy="280" r="8" fill="#FFB6C1"/>
  <circle cx="315" cy="275" r="7" fill="#FFB6C1"/>
  <circle cx="308" cy="290" r="7" fill="#FFB6C1"/>
  
  <!-- Bobina de película -->
  <circle cx="80" cy="300" r="20" fill="none" stroke="#FFD700" stroke-width="3"/>
  <circle cx="80" cy="300" r="15" fill="none" stroke="#FFD700" stroke-width="2"/>
  <circle cx="320" cy="80" r="20" fill="none" stroke="#FFD700" stroke-width="3"/>
  <circle cx="320" cy="80" r="15" fill="none" stroke="#FFD700" stroke-width="2"/>
</svg>